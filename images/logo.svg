<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg" width="200" height="60">
  <!-- Logo: Modern tech company style -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main icon -->
  <g>
    <!-- Circuit board pattern -->
    <rect x="5" y="8" width="40" height="40" rx="4" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
    <circle cx="12" cy="15" r="2.5" fill="url(#logoGradient)"/>
    <circle cx="38" cy="15" r="2.5" fill="url(#logoGradient)"/>
    <circle cx="12" cy="41" r="2.5" fill="url(#logoGradient)"/>
    <circle cx="38" cy="41" r="2.5" fill="url(#logoGradient)"/>
    <circle cx="25" cy="28" r="2.5" fill="url(#logoGradient)"/>
    <line x1="12" y1="15" x2="25" y2="28" stroke="url(#logoGradient)" stroke-width="1.5"/>
    <line x1="38" y1="15" x2="25" y2="28" stroke="url(#logoGradient)" stroke-width="1.5"/>
    <line x1="12" y1="41" x2="25" y2="28" stroke="url(#logoGradient)" stroke-width="1.5"/>
    <line x1="38" y1="41" x2="25" y2="28" stroke="url(#logoGradient)" stroke-width="1.5"/>
  </g>
  
  <!-- Company text -->
  <text x="55" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0d47a1">
    ZHENGXIN
  </text>
  <text x="55" y="40" font-family="Arial, sans-serif" font-size="12" fill="#1a73e8">
    SHUZHI TECH
  </text>
</svg>
